name: Supabase keep-alive

on:
  schedule:
    - cron: '0 12 */2 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -f -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/projects?select=id&limit=1"

      - name: Ping Vercel frontend
        run: curl -f -o /dev/null https://ciencias-tecnologia-institucional-i.vercel.app/
